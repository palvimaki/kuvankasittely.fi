name: PR CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx pwa-assets-generator --preset minimal-2023 assets/logo.png
      - run: npm run build
      - run: npm audit --audit-level=high
